<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recall Recipes — Paul's Kitchen</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,900;1,400;1,700&family=Libre+Baskerville:ital@1&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

:root {
  --sage:      #6B8F71;
  --sage-dark: #4A6850;
  --sage-lt:   #E8F0E9;
  --text:      #000000;
  --muted:     #666666;
  --border:    #d0d0d0;
  --bg:        #E8F0E9;
}

body {
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  overflow-x: hidden;
}

/* ── HEADER ── */
header {
  text-align: center;
  padding: 2.8rem 2rem 1.4rem;
  border-bottom: 1px solid #000;
}

header h1 {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 4.2rem;
  font-weight: 900;
  letter-spacing: -1px;
  line-height: 1;
  margin-bottom: 0.55rem;
}

header p {
  font-size: 0.65rem;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--text);
  font-weight: 400;
}

/* ── NAV ── */
nav {
  border-bottom: 1px solid #000;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 2.5rem;
  padding: 0.8rem 2rem;
}

.nav-link {
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text);
  cursor: pointer;
  background: none;
  border: none;
  font-family: inherit;
  padding: 0;
  transition: color 0.15s;
}

.nav-link:hover { color: var(--sage); }

.nav-add {
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text);
  cursor: pointer;
  background: var(--bg);
  border: 1px solid var(--text);
  font-family: inherit;
  padding: 0.35rem 0.9rem;
  transition: all 0.15s;
}

.nav-add:hover { background: var(--sage); color: #fff; border-color: var(--sage); }

/* ── MAIN AREA ── */
.main {
  max-width: 1260px;
  margin: 0 auto;
  padding: 0 2rem;
}

/* ── SEARCH ── */
.search-wrap {
  padding: 1.6rem 0 0.8rem;
  border-bottom: 1px solid #e0e0e0;
}

.search-wrap input {
  width: 100%;
  border: none;
  outline: none;
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 1.7rem;
  font-style: italic;
  font-weight: 400;
  color: var(--text);
  background: transparent;
}

.search-wrap input::placeholder { color: #aaa; }

/* ── FILTER ROWS ── */
.filters {
  padding: 1.2rem 0 0.6rem;
  border-bottom: 1px solid #e0e0e0;
  display: flex;
  flex-direction: column;
  gap: 0.85rem;
}

.filter-row {
  display: flex;
  align-items: flex-start;
  gap: 1rem;
}

.filter-row-label {
  font-size: 0.58rem;
  font-weight: 700;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: var(--muted);
  white-space: nowrap;
  padding-top: 0.35rem;
  min-width: 90px;
}

.pills {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
}

.pill {
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-size: 0.72rem;
  font-weight: 400;
  color: var(--text);
  background: var(--bg);
  border: 1px solid #bbb;
  border-radius: 20px;
  padding: 0.28rem 0.75rem;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.15s;
  line-height: 1.4;
}

.pill:hover {
  background: var(--sage-lt);
  border-color: var(--sage);
  color: var(--sage-dark);
}

.pill.active {
  background: var(--sage);
  border-color: var(--sage);
  color: #fff;
}

.pill.all-pill.active {
  background: var(--text);
  border-color: var(--text);
  color: #fff;
}

/* ── RESULTS BAR ── */
.results-bar {
  padding: 0.9rem 0 0;
  border-bottom: 1px solid #e0e0e0;
  margin-bottom: 0;
}

.results-count {
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted);
  padding-bottom: 0.9rem;
}

/* ── FEATURED RECIPE ── */
.featured {
  padding: 2.5rem 0 1.5rem;
  text-align: center;
  border-bottom: 1px solid #e0e0e0;
}

.featured-meta {
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 0.7rem;
}

.featured-meta span { color: var(--sage); }

.featured-title {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: clamp(2.8rem, 6vw, 5.2rem);
  font-weight: 900;
  line-height: 1.05;
  letter-spacing: -1px;
  cursor: pointer;
  transition: color 0.15s;
}

.featured-title:hover { color: var(--sage-dark); }

/* ── RECIPE LIST ── */
.recipe-list {
  padding: 0 0 4rem;
}

.recipe-item {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: baseline;
  gap: 1rem;
  padding: 1rem 0;
  border-bottom: 1px solid #f0f0f0;
  cursor: pointer;
  transition: background 0.1s;
}

.recipe-item:hover { background: #fafafa; margin: 0 -1rem; padding-left: 1rem; padding-right: 1rem; }

.recipe-item-left {}

.recipe-item-name {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 1.2rem;
  font-weight: 900;
  line-height: 1.2;
  margin-bottom: 0.3rem;
}

.recipe-item-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 0.3rem;
  align-items: center;
}

.recipe-tag {
  font-size: 0.58rem;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--muted);
}

.recipe-tag::after { content: '·'; margin-left: 0.4rem; }
.recipe-tag:last-child::after { content: ''; }

.recipe-item-right {
  text-align: right;
  white-space: nowrap;
}

.recipe-item-time {
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--muted);
}

.recipe-item-serves {
  font-size: 0.58rem;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: #bbb;
}

/* ── EMPTY STATE ── */
.empty-state {
  padding: 3rem 0;
  text-align: center;
}

.empty-state h3 {
  font-family: 'Playfair Display', serif;
  font-size: 1.4rem;
  font-style: italic;
  font-weight: 400;
  color: var(--muted);
  margin-bottom: 0.4rem;
}

.empty-state p {
  font-size: 0.7rem;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: #bbb;
}

/* ── MODAL ── */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 1000;
  overflow-y: auto;
  padding: 2rem;
}

.modal.active { display: flex; align-items: flex-start; justify-content: center; padding-top: 4rem; }

.modal-box {
  background: #ffffff;
  border: 1px solid #ddd;
  max-width: 640px;
  width: 100%;
  max-height: 88vh;
  overflow-y: auto;
  padding: 2.5rem;
  position: relative;
  animation: slideUp 0.2s ease;
}

@keyframes slideUp {
  from { transform: translateY(12px); opacity: 0; }
  to   { transform: translateY(0);    opacity: 1; }
}

.modal-close {
  position: absolute;
  top: 1.2rem; right: 1.2rem;
  background: none;
  border: 1px solid #ddd;
  width: 28px; height: 28px;
  cursor: pointer;
  font-size: 1.1rem;
  color: var(--muted);
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}

.modal-close:hover { background: var(--sage); color: #fff; border-color: var(--sage); }

.modal-cuisine {
  font-size: 0.62rem;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: var(--sage);
  margin-bottom: 0.4rem;
  font-weight: 700;
}

.modal-box h2 {
  font-family: 'Playfair Display', serif;
  font-size: 2rem;
  font-weight: 900;
  line-height: 1.1;
  margin-bottom: 0.8rem;
}

.modal-meta {
  display: flex;
  gap: 1.5rem;
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 1.2rem;
  padding-bottom: 1.2rem;
  border-bottom: 1px solid #f0f0f0;
}

.modal-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 0.3rem;
  margin-bottom: 1.5rem;
}

.modal-pill {
  font-size: 0.6rem;
  font-weight: 400;
  padding: 0.2rem 0.6rem;
  border: 1px solid #ddd;
  border-radius: 20px;
  color: var(--muted);
}

.modal-section { margin-top: 1.5rem; }

.modal-section h3 {
  font-size: 0.58rem;
  letter-spacing: 3px;
  text-transform: uppercase;
  font-weight: 700;
  color: var(--muted);
  margin-bottom: 0.8rem;
  padding-bottom: 0.4rem;
  border-bottom: 1px solid #f0f0f0;
}

.ingredients-list { list-style: none; }

.ingredients-list li {
  font-size: 0.82rem;
  padding: 0.35rem 0;
  border-bottom: 1px solid #f5f5f5;
  color: var(--text);
  display: flex;
  gap: 0.5rem;
  align-items: baseline;
}

.ingredients-list li::before { content: '—'; color: #ccc; font-size: 0.7rem; flex-shrink: 0; }

.instructions-list { list-style: none; counter-reset: step; }

.instructions-list li {
  counter-increment: step;
  position: relative;
  padding-left: 2rem;
  margin-bottom: 0.85rem;
  font-size: 0.82rem;
  line-height: 1.65;
  color: var(--text);
}

.instructions-list li::before {
  content: counter(step);
  position: absolute;
  left: 0; top: 0.05rem;
  width: 1.3rem; height: 1.3rem;
  background: var(--sage);
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.6rem;
  font-weight: 700;
}

/* ── ADD RECIPE MODAL ── */
.form-modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 1001;
  overflow-y: auto;
  padding: 2rem;
}

.form-modal.active { display: flex; align-items: flex-start; justify-content: center; padding-top: 2rem; }

.form-box {
  background: #ffffff;
  border: 1px solid #ddd;
  max-width: 600px;
  width: 100%;
  padding: 2.5rem;
  position: relative;
  animation: slideUp 0.2s ease;
}

.form-close {
  position: absolute;
  top: 1.2rem; right: 1.2rem;
  background: none; border: 1px solid #ddd;
  width: 28px; height: 28px;
  cursor: pointer; font-size: 1.1rem;
  color: var(--muted);
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}

.form-close:hover { background: var(--sage); color: #fff; border-color: var(--sage); }

.form-box h2 {
  font-family: 'Playfair Display', serif;
  font-size: 1.8rem; font-weight: 900;
  margin-bottom: 1.5rem;
}

.form-group { margin-bottom: 1.1rem; }

.form-group label {
  display: block;
  font-size: 0.58rem; letter-spacing: 2.5px; text-transform: uppercase;
  font-weight: 700; color: var(--muted); margin-bottom: 0.4rem;
}

.form-group input,
.form-group textarea {
  width: 100%;
  background: var(--bg);
  border: 1px solid #ddd;
  padding: 0.55rem 0.75rem;
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-size: 0.82rem;
  color: var(--text);
  outline: none;
  transition: border-color 0.15s;
}

.form-group input:focus, .form-group textarea:focus { border-color: var(--sage); }
.form-group input::placeholder, .form-group textarea::placeholder { color: #ccc; }
.form-group textarea { resize: vertical; min-height: 80px; }

.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

.form-btns { display: flex; gap: 0.8rem; margin-top: 1.5rem; }

.form-btn {
  flex: 1; padding: 0.6rem;
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-size: 0.62rem; letter-spacing: 2px; text-transform: uppercase; font-weight: 700;
  border: 1px solid #ddd; cursor: pointer; transition: all 0.15s;
}

.form-btn.submit { background: var(--sage); color: #fff; border-color: var(--sage); }
.form-btn.submit:hover { background: var(--sage-dark); border-color: var(--sage-dark); }
.form-btn.cancel { background: var(--bg); color: var(--muted); }
.form-btn.cancel:hover { background: var(--text); color: #fff; border-color: var(--text); }

@media (max-width: 768px) {
  header h1 { font-size: 2.6rem; }
  .filter-row { flex-direction: column; gap: 0.4rem; }
  .filter-row-label { min-width: unset; }
  .recipe-item { grid-template-columns: 1fr; }
  .recipe-item-right { text-align: left; }
}
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <h1>Recall Recipes</h1>
  <p>A Community Table &middot; By Paul Barbera</p>
</header>

<!-- NAV -->
<nav>
  <button class="nav-link" onclick="showView('recipes')">Recipes</button>
  <button class="nav-link" onclick="showView('contributors')">Contributors</button>
  <button class="nav-add" id="navAddBtn">+ Add Recipe</button>
</nav>

<!-- MAIN -->
<div class="main">

  <!-- SEARCH -->
  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="Search recipes…">
  </div>

  <!-- FILTERS -->
  <div class="filters" id="filtersSection">
    <div class="filter-row">
      <span class="filter-row-label">Contributors</span>
      <div class="pills" id="contributorFilters"></div>
    </div>
    <div class="filter-row">
      <span class="filter-row-label">From</span>
      <div class="pills" id="fromFilters"></div>
    </div>
    <div class="filter-row">
      <span class="filter-row-label">Cuisine</span>
      <div class="pills" id="cuisineFilters"></div>
    </div>
    <div class="filter-row">
      <span class="filter-row-label">Mood</span>
      <div class="pills" id="moodFilters"></div>
    </div>
    <div class="filter-row">
      <span class="filter-row-label">Dietary</span>
      <div class="pills" id="dietaryFilters"></div>
    </div>
  </div>

  <!-- RESULTS COUNT -->
  <div class="results-bar">
    <div class="results-count" id="resultsCount">0 of 0 Recipes</div>
  </div>

  <!-- FEATURED -->
  <div class="featured" id="featuredSection">
    <div class="featured-meta" id="featuredMeta"></div>
    <div class="featured-title" id="featuredTitle" onclick="openFeatured()"></div>
  </div>

  <!-- LIST -->
  <div class="recipe-list" id="recipeList"></div>

  <div class="empty-state" id="emptyState" style="display:none">
    <h3>No recipes found</h3>
    <p>Try adjusting your search or filters</p>
  </div>

</div>

<!-- RECIPE MODAL -->
<div class="modal" id="recipeModal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal()">×</button>
    <div id="modalBody"></div>
  </div>
</div>

<!-- ADD RECIPE MODAL -->
<div class="form-modal" id="addRecipeModal">
  <div class="form-box">
    <button class="form-close" onclick="closeForm()">×</button>
    <h2>Add New Recipe</h2>
    <form id="recipeForm">
      <div class="form-group">
        <label>Recipe Title</label>
        <input type="text" id="formTitle" placeholder="e.g., Tempura Udon" required>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Servings</label>
          <input type="text" id="formServings" placeholder="e.g., 4" required>
        </div>
        <div class="form-group">
          <label>Time</label>
          <input type="text" id="formTime" placeholder="e.g., 45 mins" required>
        </div>
      </div>
      <div class="form-group">
        <label>Mood (comma-separated)</label>
        <input type="text" id="formMood" placeholder="e.g., comfort, quick" required>
      </div>
      <div class="form-group">
        <label>Cuisine (comma-separated)</label>
        <input type="text" id="formCuisine" placeholder="e.g., Japanese, Italian" required>
      </div>
      <div class="form-group">
        <label>Dietary (comma-separated)</label>
        <input type="text" id="formDietary" placeholder="e.g., vegan, seafood">
      </div>
      <div class="form-group">
        <label>Ingredients (comma-separated)</label>
        <textarea id="formIngredients" placeholder="e.g., olive oil, garlic…" required></textarea>
      </div>
      <div class="form-group">
        <label>Instructions (one per line)</label>
        <textarea id="formInstructions" placeholder="Step one&#10;Step two…" required></textarea>
      </div>
      <div class="form-btns">
        <button type="button" class="form-btn cancel" onclick="closeForm()">Cancel</button>
        <button type="submit" class="form-btn submit">Add Recipe</button>
      </div>
    </form>
  </div>
</div>

<script>
// ── DATA ────────────────────────────────────────────────────────────
const recipes = [
  { id:1,  title:"Tempura Udon",                          contributor:"Paul Barbera", from:"",           mood:["comfort","quick"],                    cuisine:["Japanese"],              dietary:["seafood"],               time:"30 mins", servings:2,             ingredients:"dashima, shiitake mushrooms, udon noodles, prawns, tempura batter, narutomaki, scallions",                                                                              instructions:["Soak dashima and shiitake mushrooms in water overnight.","Add soy sauce, mirin, and sugar, then boil the broth.","Boil udon noodles separately, then add to broth with mushrooms and narutomaki.","Prepare tempura batter with cake flour, baking powder, salt, and ice water.","Deep fry shrimp for a couple minutes until they float.","Serve tempura with udon, topped with sliced scallions."] },
  { id:2,  title:"Marmalade",                              contributor:"Paul Barbera", from:"Mum",        mood:["preservation","special"],             cuisine:["British"],               dietary:["vegan"],                 time:"2+ hours", servings:"multiple jars", ingredients:"Seville oranges (2.2kg), water (2L), sugar (1.5kg)",                                                                                                               instructions:["Cut Seville oranges into pieces.","Soak in water overnight.","Add sugar.","Cook until setting point is reached."] },
  { id:3,  title:"Kimchi Gyoza Nabe",                     contributor:"Paul Barbera", from:"",           mood:["spicy","warming","communal"],         cuisine:["Japanese-Korean fusion"], dietary:["vegetarian-adaptable"],  time:"40 mins", servings:2,             ingredients:"napa cabbage, gyoza, kimchi, shiitake mushrooms, tofu, gochujang, gochugaru, kombu dashi",                                                                          instructions:["Prepare all vegetables and tofu, cutting as specified.","Heat kombu dashi with kimchi, gochujang, gochugaru, sugar, soy sauce, and miso.","Bring to a boil, then reduce to simmer.","Add vegetables in stages based on cooking time.","Add gyoza and tofu, simmer until gyoza float.","Top with sesame oil and serve family-style."] },
  { id:4,  title:"Easy Chicken Ramen",                    contributor:"Paul Barbera", from:"",           mood:["comfort","warming"],                  cuisine:["Japanese"],              dietary:[],                        time:"45 mins", servings:4,             ingredients:"chicken thigh, mirin, soy sauce, garlic, ginger, spring onions, shiitake mushrooms, ramen noodles, eggs",                                                              instructions:["Marinate chicken in mirin, soy sauce, cayenne, garlic for at least 1 hour.","Roast chicken at 425°F for 15 minutes, then glaze and cook 10-15 minutes more.","Simmer stock with garlic, ginger, spring onions, chili, soy sauce, and mirin for 25 minutes.","Cook ramen noodles 1 minute less than package directions.","Strain stock, add mushrooms, simmer 5 minutes.","Make soft-boiled eggs (6-6.5 minutes in boiling water).","Assemble bowls with noodles, stock, chicken, eggs, greens, and toppings."] },
  { id:5,  title:"Roasted Cauliflower with Spices",        contributor:"Paul Barbera", from:"",           mood:["easy","healthy","side"],              cuisine:["Indian"],                dietary:["vegan"],                 time:"45 mins", servings:4,             ingredients:"cauliflower florets, turmeric, cumin, coriander, cumin seeds, green chilli, shallots, garlic, olive oil",                                                          instructions:["Preheat oven to 200°C.","Mix cauliflower with olive oil, spices, and aromatics.","Let stand 30 minutes.","Spread on large roasting pan in single layer.","Roast 30-45 minutes until golden.","Serve with chopped coriander and spring onions."] },
  { id:6,  title:"Butternut Squash with Feta & Yogurt",   contributor:"Paul Barbera", from:"",           mood:["seasonal","side"],                    cuisine:["Mediterranean"],         dietary:["vegetarian"],             time:"60 mins", servings:4,             ingredients:"butternut squash, olive oil, coriander seeds, smoked salt, red onion, feta cheese, pumpkin seeds, yogurt, fresh herbs",                                            instructions:["Cut butternut in pieces, keeping skin.","Mix with olive oil, salt, pepper, coriander seeds, smoked salt.","Roast at high temperature until brown.","Fry red onion until golden, add to butternut.","Heat at lower temperature for 30+ minutes.","Make yogurt sauce: Greek yogurt, coriander, garlic, mint, onions, salt, pepper, olive oil.","Serve with feta, coriander, and grilled pumpkin seeds."] },

// ── STATE ───────────────────────────────────────────────────────────
const activeFilters = { contributor:[], from:[], cuisine:[], mood:[], dietary:[] };
let searchTerm = '';
let featuredRecipeId = null;

// ── HELPERS ─────────────────────────────────────────────────────────
function countOf(field, val) {
  if (field === 'contributor') return recipes.filter(r => r.contributor === val).length;
  if (field === 'from')        return recipes.filter(r => r.from === val).length;
  return recipes.filter(r => (r[field]||[]).includes(val)).length;
}

function allValues(field) {
  if (field === 'contributor' || field === 'from') {
    const s = new Set(recipes.map(r => r[field]).filter(Boolean));
    return Array.from(s).sort();
  }
  const s = new Set();
  recipes.forEach(r => (r[field]||[]).filter(Boolean).forEach(v => s.add(v)));
  return Array.from(s).sort();
}

function filtered() {
  return recipes.filter(r => {
    const sOk = !searchTerm || r.title.toLowerCase().includes(searchTerm) || r.ingredients.toLowerCase().includes(searchTerm);
    const coOk = !activeFilters.contributor.length || activeFilters.contributor.includes(r.contributor);
    const fOk  = !activeFilters.from.length        || activeFilters.from.includes(r.from);
    const cOk  = !activeFilters.cuisine.length     || activeFilters.cuisine.some(c => (r.cuisine||[]).includes(c));
    const mOk  = !activeFilters.mood.length        || activeFilters.mood.some(m => (r.mood||[]).includes(m));
    const dOk  = !activeFilters.dietary.length     || activeFilters.dietary.some(d => (r.dietary||[]).includes(d));
    return sOk && coOk && fOk && cOk && mOk && dOk;
  });
}

// ── BUILD FILTERS ────────────────────────────────────────────────────
function buildFilters() {
  const configs = [
    { id:'contributorFilters', field:'contributor', allLabel:'All' },
    { id:'fromFilters',        field:'from',        allLabel:'All' },
    { id:'cuisineFilters',     field:'cuisine',     allLabel:'All' },
    { id:'moodFilters',        field:'mood',        allLabel:'All' },
    { id:'dietaryFilters',     field:'dietary',     allLabel:'All' },
  ];
  configs.forEach(({ id, field, allLabel }) => {
    const wrap = document.getElementById(id);
    wrap.innerHTML = '';
    const total = recipes.length;
    const allBtn = document.createElement('button');
    allBtn.className = 'pill all-pill' + (activeFilters[field].length === 0 ? ' active' : '');
    allBtn.textContent = `${allLabel} ${total}`;
    allBtn.onclick = () => { activeFilters[field] = []; buildFilters(); render(); };
    wrap.appendChild(allBtn);

    allValues(field).forEach(val => {
      const cnt = countOf(field, val);
      const btn = document.createElement('button');
      btn.className = 'pill' + (activeFilters[field].includes(val) ? ' active' : '');
      btn.textContent = `${val} ${cnt}`;
      btn.onclick = () => toggleFilter(field, val);
      wrap.appendChild(btn);
    });
  });
}

function toggleFilter(field, val) {
  const idx = activeFilters[field].indexOf(val);
  if (idx > -1) activeFilters[field].splice(idx, 1);
  else activeFilters[field].push(val);
  buildFilters();
  render();
}

// ── RENDER ───────────────────────────────────────────────────────────
function render() {
  const rows = filtered();
  const total = recipes.length;
  document.getElementById('resultsCount').textContent =
    `${rows.length} of ${total} Recipe${total !== 1 ? 's' : ''}`;

  if (!rows.length) {
    document.getElementById('featuredSection').style.display = 'none';
    document.getElementById('recipeList').innerHTML = '';
    document.getElementById('emptyState').style.display = 'block';
    return;
  }

  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('featuredSection').style.display = 'block';

  // Featured = first result
  const feat = rows[0];
  featuredRecipeId = feat.id;
  const moodLabel = (feat.mood||[]).filter(Boolean)[0] || '';
  const cuisineLabel = (feat.cuisine||[]).filter(Boolean)[0] || '';
  const meta = [cuisineLabel, moodLabel, feat.time, `Serves ${feat.servings}`].filter(Boolean).join(' · ').toUpperCase();
  document.getElementById('featuredMeta').innerHTML = meta.replace(moodLabel.toUpperCase(), `<span>${moodLabel.toUpperCase()}</span>`);
  document.getElementById('featuredTitle').textContent = feat.title;

  // Remaining list
  const list = document.getElementById('recipeList');
  list.innerHTML = rows.slice(1).map(r => {
    const tags = [...(r.mood||[]), ...(r.cuisine||[])].filter(Boolean).slice(0,4);
    return `<div class="recipe-item" onclick="openModal(${r.id})">
      <div class="recipe-item-left">
        <div class="recipe-item-name">${r.title}</div>
        <div class="recipe-item-tags">
          ${tags.map(t => `<span class="recipe-tag">${t}</span>`).join('')}
        </div>
      </div>
      <div class="recipe-item-right">
        <div class="recipe-item-time">${r.time}</div>
        <div class="recipe-item-serves">Serves ${r.servings}</div>
      </div>
    </div>`;
  }).join('');
}

function openFeatured() {
  if (featuredRecipeId) openModal(featuredRecipeId);
}

// ── MODAL ────────────────────────────────────────────────────────────
function openModal(id) {
  const r = recipes.find(x => x.id === id);
  if (!r) return;
  const cuisineStr = (r.cuisine||[]).filter(Boolean).join(' · ');
  const allTags = [...(r.mood||[]), ...(r.cuisine||[]), ...(r.dietary||[])].filter(Boolean);
  document.getElementById('modalBody').innerHTML = `
    ${cuisineStr ? `<div class="modal-cuisine">${cuisineStr}</div>` : ''}
    <h2>${r.title}</h2>
    <div class="modal-meta">
      <span>${r.time}</span>
      <span>Serves ${r.servings}</span>
    </div>
    <div class="modal-pills">${allTags.map(t=>`<span class="modal-pill">${t}</span>`).join('')}</div>
    <div class="modal-section">
      <h3>Ingredients</h3>
      <ul class="ingredients-list">${r.ingredients.split(',').map(i=>`<li>${i.trim()}</li>`).join('')}</ul>
    </div>
    <div class="modal-section">
      <h3>Method</h3>
      <ol class="instructions-list">${r.instructions.map(s=>`<li>${s}</li>`).join('')}</ol>
    </div>
  `;
  document.getElementById('recipeModal').classList.add('active');
}

function closeModal() { document.getElementById('recipeModal').classList.remove('active'); }

document.getElementById('recipeModal').addEventListener('click', e => {
  if (e.target === document.getElementById('recipeModal')) closeModal();
});

// ── ADD RECIPE ────────────────────────────────────────────────────────
document.getElementById('navAddBtn').addEventListener('click', () => {
  document.getElementById('addRecipeModal').classList.add('active');
});

function closeForm() {
  document.getElementById('addRecipeModal').classList.remove('active');
  document.getElementById('recipeForm').reset();
}

document.getElementById('recipeForm').addEventListener('submit', e => {
  e.preventDefault();
  recipes.push({
    id:          recipes.length + 1,
    title:       document.getElementById('formTitle').value,
    contributor: 'Paul Barbera',
    from:        '',
    mood:        document.getElementById('formMood').value.split(',').map(s=>s.trim()).filter(Boolean),
    cuisine:     document.getElementById('formCuisine').value.split(',').map(s=>s.trim()).filter(Boolean),
    dietary:     document.getElementById('formDietary').value.split(',').map(s=>s.trim()).filter(Boolean),
    ingredients: document.getElementById('formIngredients').value,
    servings:    document.getElementById('formServings').value,
    time:        document.getElementById('formTime').value,
    instructions:document.getElementById('formInstructions').value.split('\n').map(s=>s.trim()).filter(Boolean)
  });
  buildFilters();
  render();
  closeForm();
});

// ── SEARCH ────────────────────────────────────────────────────────────
document.getElementById('searchInput').addEventListener('input', e => {
  searchTerm = e.target.value.toLowerCase().trim();
  render();
});

// ── INIT ──────────────────────────────────────────────────────────────
function showView(v) { /* placeholder for future views */ }
buildFilters();
render();
</script>
</body>
</html>
