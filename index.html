<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recall Recipes — Paul's Kitchen</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg:       #F5F0E6;
  --text:     #1E0E05;
  --muted:    #7A6348;
  --border:   #C8B69A;
  --border-lt:#E0D5C2;
  --accent:   #1E0E05;
  --card-bg:  #F5F0E6;
  --tag-bg:   #EDE6D6;
}

body {
  font-family: 'Montserrat', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  overflow-x: hidden;
}

/* ── HEADER ── */
header {
  background: var(--bg);
  border-bottom: 2px solid var(--text);
  padding: 2.5rem 2.5rem 1.5rem;
  position: sticky;
  top: 0;
  z-index: 100;
}

.header-inner {
  max-width: 1300px;
  margin: 0 auto;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 1rem;
}

.header-title h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 3.6rem;
  font-weight: 700;
  letter-spacing: -1px;
  line-height: 1;
  color: var(--text);
}

.header-title p {
  font-family: 'Montserrat', sans-serif;
  font-size: 0.62rem;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--muted);
  margin-top: 0.4rem;
  font-weight: 500;
}

.header-meta {
  text-align: right;
  font-size: 0.65rem;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 500;
  line-height: 1.8;
}

/* ── CONTROLS ── */
.controls-wrap {
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: 1.2rem 2.5rem;
}

.controls-inner {
  max-width: 1300px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 0.9rem;
}

.search-row {
  display: flex;
  align-items: center;
  gap: 0.7rem;
  border: 1px solid var(--border);
  padding: 0.55rem 1rem;
  background: var(--bg);
  max-width: 440px;
}

.search-row svg {
  width: 13px;
  height: 13px;
  stroke: var(--muted);
  flex-shrink: 0;
}

.search-row input {
  flex: 1;
  background: none;
  border: none;
  outline: none;
  font-family: 'Montserrat', sans-serif;
  font-size: 0.72rem;
  font-weight: 500;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--text);
}

.search-row input::placeholder { color: var(--muted); }

.filter-row {
  display: flex;
  align-items: baseline;
  gap: 0.6rem;
  flex-wrap: wrap;
}

.filter-label {
  font-size: 0.58rem;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 600;
  white-space: nowrap;
  flex-shrink: 0;
  padding-right: 0.3rem;
  border-right: 1px solid var(--border);
  margin-right: 0.2rem;
}

.filter-btn {
  padding: 0.28rem 0.65rem;
  background: var(--tag-bg);
  border: 1px solid var(--border);
  color: var(--muted);
  cursor: pointer;
  font-family: 'Montserrat', sans-serif;
  font-size: 0.6rem;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  transition: all 0.15s ease;
  white-space: nowrap;
  border-radius: 2px;
}

.filter-btn:hover {
  background: var(--text);
  color: var(--bg);
  border-color: var(--text);
}

.filter-btn.active {
  background: var(--text);
  color: var(--bg);
  border-color: var(--text);
}

/* ── RESULTS BAR ── */
.results-bar {
  max-width: 1300px;
  margin: 0 auto;
  padding: 1rem 2.5rem 0.6rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.results-count {
  font-size: 0.62rem;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 500;
}

.results-count strong { color: var(--text); font-weight: 700; }

.add-btn {
  font-family: 'Montserrat', sans-serif;
  font-size: 0.6rem;
  letter-spacing: 2px;
  text-transform: uppercase;
  font-weight: 600;
  padding: 0.38rem 0.9rem;
  background: transparent;
  border: 1px solid var(--text);
  color: var(--text);
  cursor: pointer;
  transition: all 0.15s ease;
}

.add-btn:hover { background: var(--text); color: var(--bg); }

/* ── RECIPE LIST ── */
.recipe-list {
  max-width: 1300px;
  margin: 0 auto;
  padding: 0 2.5rem 4rem;
}

.recipe-row {
  display: grid;
  grid-template-columns: 2.5rem 1fr auto;
  gap: 1.5rem;
  padding: 1.4rem 0;
  border-bottom: 1px solid var(--border-lt);
  cursor: pointer;
  transition: background 0.15s ease;
  align-items: start;
}

.recipe-row:hover {
  background: rgba(30,14,5,0.03);
  margin: 0 -1rem;
  padding-left: 1rem;
  padding-right: 1rem;
}

.recipe-num {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.1rem;
  color: var(--border);
  font-weight: 400;
  padding-top: 0.1rem;
  text-align: right;
}

.recipe-main {}

.recipe-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.35rem;
  font-weight: 600;
  color: var(--text);
  line-height: 1.2;
  margin-bottom: 0.5rem;
}

.recipe-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 0.3rem;
  margin-bottom: 0.5rem;
}

.tag {
  font-size: 0.55rem;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  font-weight: 600;
  padding: 0.2rem 0.5rem;
  border-radius: 2px;
  border: 1px solid var(--border);
  color: var(--muted);
  background: var(--tag-bg);
}

.tag.mood { border-color: #B8A88A; }
.tag.cuisine { border-color: var(--text); color: var(--text); background: transparent; }

.recipe-ingredients {
  font-size: 0.7rem;
  color: var(--muted);
  font-weight: 400;
  line-height: 1.5;
}

.recipe-side {
  text-align: right;
  min-width: 120px;
  padding-top: 0.2rem;
}

.recipe-cuisine-label {
  font-family: 'Cormorant Garamond', serif;
  font-size: 0.85rem;
  font-style: italic;
  color: var(--muted);
  margin-bottom: 0.35rem;
}

.recipe-time {
  font-size: 0.6rem;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  font-weight: 600;
  color: var(--text);
}

.recipe-servings {
  font-size: 0.58rem;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--muted);
  margin-top: 0.2rem;
}

/* ── EMPTY STATE ── */
.empty-state {
  padding: 3rem 0;
  text-align: center;
  color: var(--muted);
}

.empty-state h3 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.5rem;
  font-weight: 400;
  margin-bottom: 0.5rem;
}

.empty-state p {
  font-size: 0.7rem;
  letter-spacing: 1px;
  text-transform: uppercase;
}

/* ── MODAL OVERLAY ── */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(30,14,5,0.55);
  z-index: 1000;
  overflow-y: auto;
  padding: 2rem;
}

.modal.active {
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding-top: 3.5rem;
}

.modal-box {
  background: var(--bg);
  border: 1px solid var(--border);
  max-width: 640px;
  width: 100%;
  max-height: 88vh;
  overflow-y: auto;
  padding: 2.5rem;
  position: relative;
  animation: slideUp 0.25s ease;
}

@keyframes slideUp {
  from { transform: translateY(16px); opacity: 0; }
  to   { transform: translateY(0);    opacity: 1; }
}

.modal-close {
  position: absolute;
  top: 1.2rem;
  right: 1.2rem;
  background: none;
  border: 1px solid var(--border);
  width: 28px; height: 28px;
  cursor: pointer;
  font-size: 1.1rem;
  color: var(--muted);
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
  font-family: 'Montserrat', sans-serif;
}

.modal-close:hover { background: var(--text); color: var(--bg); border-color: var(--text); }

.modal-cuisine {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 0.9rem;
  color: var(--muted);
  margin-bottom: 0.4rem;
  letter-spacing: 0.5px;
}

.modal h2 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 2.1rem;
  font-weight: 700;
  line-height: 1.1;
  margin-bottom: 0.8rem;
}

.modal-meta {
  display: flex;
  gap: 1.5rem;
  font-size: 0.62rem;
  letter-spacing: 2px;
  text-transform: uppercase;
  font-weight: 600;
  color: var(--muted);
  margin-bottom: 1.2rem;
  padding-bottom: 1.2rem;
  border-bottom: 1px solid var(--border-lt);
}

.modal-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 0.35rem;
  margin-bottom: 1.5rem;
}

.modal-section { margin-top: 1.5rem; }

.modal-section h3 {
  font-size: 0.6rem;
  letter-spacing: 3px;
  text-transform: uppercase;
  font-weight: 700;
  color: var(--muted);
  margin-bottom: 0.9rem;
  padding-bottom: 0.4rem;
  border-bottom: 1px solid var(--border-lt);
}

.ingredients-list {
  list-style: none;
  font-size: 0.8rem;
  color: var(--text);
  line-height: 1.6;
}

.ingredients-list li {
  padding: 0.35rem 0;
  border-bottom: 1px solid var(--border-lt);
  display: flex;
  align-items: baseline;
  gap: 0.6rem;
}

.ingredients-list li::before {
  content: '—';
  color: var(--border);
  font-size: 0.7rem;
  flex-shrink: 0;
}

.instructions-list {
  list-style: none;
  counter-reset: step;
}

.instructions-list li {
  counter-increment: step;
  position: relative;
  padding-left: 2rem;
  margin-bottom: 0.9rem;
  font-size: 0.8rem;
  line-height: 1.65;
  color: var(--text);
}

.instructions-list li::before {
  content: counter(step);
  position: absolute;
  left: 0;
  top: 0.05rem;
  width: 1.3rem; height: 1.3rem;
  background: var(--text);
  color: var(--bg);
  display: flex; align-items: center; justify-content: center;
  font-size: 0.6rem;
  font-weight: 700;
  letter-spacing: 0.5px;
}

/* ── FORM MODAL ── */
.form-modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(30,14,5,0.55);
  z-index: 1001;
  overflow-y: auto;
  padding: 2rem;
}

.form-modal.active {
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding-top: 2rem;
}

.form-box {
  background: var(--bg);
  border: 1px solid var(--border);
  max-width: 600px;
  width: 100%;
  padding: 2.5rem;
  position: relative;
  animation: slideUp 0.25s ease;
}

.form-close {
  position: absolute;
  top: 1.2rem; right: 1.2rem;
  background: none;
  border: 1px solid var(--border);
  width: 28px; height: 28px;
  cursor: pointer;
  font-size: 1.1rem;
  color: var(--muted);
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}

.form-close:hover { background: var(--text); color: var(--bg); border-color: var(--text); }

.form-box h2 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.8rem;
  font-weight: 700;
  margin-bottom: 1.5rem;
}

.form-group { margin-bottom: 1.1rem; }

.form-group label {
  display: block;
  font-size: 0.58rem;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  font-weight: 700;
  color: var(--muted);
  margin-bottom: 0.4rem;
}

.form-group input,
.form-group textarea,
.form-group select {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  padding: 0.55rem 0.75rem;
  font-family: 'Montserrat', sans-serif;
  font-size: 0.78rem;
  color: var(--text);
  outline: none;
  transition: border-color 0.15s;
}

.form-group input:focus,
.form-group textarea:focus { border-color: var(--text); }

.form-group input::placeholder,
.form-group textarea::placeholder { color: var(--border); }

.form-group textarea { resize: vertical; min-height: 80px; }

.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

.form-btns { display: flex; gap: 0.8rem; margin-top: 1.5rem; }

.form-btn {
  flex: 1;
  padding: 0.6rem;
  font-family: 'Montserrat', sans-serif;
  font-size: 0.62rem;
  letter-spacing: 2px;
  text-transform: uppercase;
  font-weight: 700;
  border: 1px solid var(--border);
  cursor: pointer;
  transition: all 0.15s;
}

.form-btn.submit { background: var(--text); color: var(--bg); border-color: var(--text); }
.form-btn.submit:hover { background: var(--bg); color: var(--text); }
.form-btn.cancel { background: var(--bg); color: var(--muted); }
.form-btn.cancel:hover { background: var(--text); color: var(--bg); border-color: var(--text); }

/* ── RESPONSIVE ── */
@media (max-width: 768px) {
  header { padding: 1.5rem; }
  .header-title h1 { font-size: 2.4rem; }
  .header-meta { display: none; }
  .controls-wrap { padding: 1rem 1.5rem; }
  .results-bar, .recipe-list { padding-left: 1.5rem; padding-right: 1.5rem; }
  .recipe-row { grid-template-columns: 2rem 1fr; }
  .recipe-side { display: none; }
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

.recipe-row { animation: fadeIn 0.3s ease both; }
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="header-inner">
    <div class="header-title">
      <h1>Recall Recipes</h1>
      <p>Search by mood, cuisine or ingredients</p>
    </div>
    <div class="header-meta" id="headerMeta">
      Loading…
    </div>
  </div>
</header>

<!-- CONTROLS -->
<div class="controls-wrap">
  <div class="controls-inner">
    <div class="search-row">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input type="text" id="searchInput" placeholder="Search recipes, ingredients…">
    </div>
    <div class="filter-row">
      <span class="filter-label">Mood</span>
      <div id="moodFilters" style="display:contents"></div>
    </div>
    <div class="filter-row">
      <span class="filter-label">Cuisine</span>
      <div id="cuisineFilters" style="display:contents"></div>
    </div>
    <div class="filter-row">
      <span class="filter-label">Dietary</span>
      <div id="dietaryFilters" style="display:contents"></div>
    </div>
  </div>
</div>

<!-- RESULTS BAR -->
<div class="results-bar">
  <span class="results-count">Showing <strong id="resultCount">0</strong> recipes</span>
  <button class="add-btn" id="addRecipeBtn">+ Add Recipe</button>
</div>

<!-- RECIPE LIST -->
<div class="recipe-list" id="recipeList"></div>

<div class="empty-state" id="emptyState" style="display:none">
  <h3>No recipes found</h3>
  <p>Try adjusting your search or filters</p>
</div>

<!-- RECIPE MODAL -->
<div class="modal" id="recipeModal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal()">×</button>
    <div id="modalBody"></div>
  </div>
</div>

<!-- ADD RECIPE MODAL -->
<div class="form-modal" id="addRecipeModal">
  <div class="form-box">
    <button class="form-close" onclick="closeForm()">×</button>
    <h2>Add New Recipe</h2>
    <form id="recipeForm">
      <div class="form-group">
        <label>Recipe Title</label>
        <input type="text" id="formTitle" placeholder="e.g., Tempura Udon" required>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Servings</label>
          <input type="text" id="formServings" placeholder="e.g., 4" required>
        </div>
        <div class="form-group">
          <label>Time</label>
          <input type="text" id="formTime" placeholder="e.g., 45 mins" required>
        </div>
      </div>
      <div class="form-group">
        <label>Moods (comma-separated)</label>
        <input type="text" id="formMood" placeholder="e.g., comfort, quick, elegant" required>
      </div>
      <div class="form-group">
        <label>Cuisine (comma-separated)</label>
        <input type="text" id="formCuisine" placeholder="e.g., Japanese, Italian" required>
      </div>
      <div class="form-group">
        <label>Dietary / Style (comma-separated)</label>
        <input type="text" id="formDietary" placeholder="e.g., vegan, seafood">
      </div>
      <div class="form-group">
        <label>Ingredients (comma-separated)</label>
        <textarea id="formIngredients" placeholder="e.g., olive oil, garlic, tomatoes…" required></textarea>
      </div>
      <div class="form-group">
        <label>Instructions (one per line)</label>
        <textarea id="formInstructions" placeholder="Step one&#10;Step two…" required></textarea>
      </div>
      <div class="form-btns">
        <button type="button" class="form-btn cancel" onclick="closeForm()">Cancel</button>
        <button type="submit" class="form-btn submit">Add Recipe</button>
      </div>
    </form>
  </div>
</div>

<script>
const recipes = [
  { id:1,  title:"Tempura Udon",                          mood:["comfort","quick"],                    cuisine:["Japanese"],             dietary:["seafood"],               ingredients:"dashima, shiitake mushrooms, udon noodles, prawns, tempura batter, narutomaki, scallions",                                                                              servings:2,        time:"30 mins",    instructions:["Soak dashima and shiitake mushrooms in water overnight.","Add soy sauce, mirin, and sugar, then boil the broth.","Boil udon noodles separately, then add to broth with mushrooms and narutomaki.","Prepare tempura batter with cake flour, baking powder, salt, and ice water.","Deep fry shrimp for a couple minutes until they float.","Serve tempura with udon, topped with sliced scallions."] },
  { id:2,  title:"Marmalade",                              mood:["preservation","special"],             cuisine:["British"],              dietary:["vegan"],                 ingredients:"Seville oranges (2.2kg), water (2L), sugar (1.5kg)",                                                                                                               servings:"multiple jars", time:"2+ hours", instructions:["Cut Seville oranges into pieces.","Soak in water overnight.","Add sugar.","Cook until setting point is reached."] },
  { id:3,  title:"Kimchi Gyoza Nabe",                     mood:["spicy","warming","communal"],         cuisine:["Japanese-Korean fusion"],dietary:["vegetarian-adaptable"],  ingredients:"napa cabbage, gyoza, kimchi, shiitake mushrooms, tofu, gochujang, gochugaru, kombu dashi",                                                                          servings:2,        time:"40 mins",    instructions:["Prepare all vegetables and tofu, cutting as specified.","Heat kombu dashi with kimchi, gochujang, gochugaru, sugar, soy sauce, and miso.","Bring to a boil, then reduce to simmer.","Add vegetables in stages based on cooking time.","Add gyoza and tofu, simmer until gyoza float.","Top with sesame oil and serve family-style."] },
  { id:4,  title:"Easy Chicken Ramen",                    mood:["comfort","warming"],                  cuisine:["Japanese"],             dietary:[""],                       ingredients:"chicken thigh, mirin, soy sauce, garlic, ginger, spring onions, shiitake mushrooms, ramen noodles, eggs",                                                              servings:4,        time:"45 mins",    instructions:["Marinate chicken in mirin, soy sauce, cayenne, garlic for at least 1 hour.","Roast chicken at 425°F for 15 minutes, then glaze and cook 10-15 minutes more.","Simmer stock with garlic, ginger, spring onions, chili, soy sauce, and mirin for 25 minutes.","Cook ramen noodles 1 minute less than package directions.","Strain stock, add mushrooms, simmer 5 minutes.","Make soft-boiled eggs (6-6.5 minutes in boiling water).","Assemble bowls with noodles, stock, chicken, eggs, greens, and toppings."] },
  { id:5,  title:"Roasted Cauliflower with Spices",        mood:["easy","healthy","side"],              cuisine:["Indian-inspired"],       dietary:["vegan"],                 ingredients:"cauliflower florets, turmeric, cumin, coriander, cumin seeds, green chilli, shallots, garlic, olive oil",                                                          servings:4,        time:"45 mins",    instructions:["Preheat oven to 200°C.","Mix cauliflower with olive oil, spices, and aromatics.","Let stand 30 minutes.","Spread on large roasting pan in single layer.","Roast 30-45 minutes until golden.","Serve with chopped coriander and spring onions."] },

// ── STATE ──────────────────────────────────────────────────
const moods = new Set(), cuisines = new Set(), dietaries = new Set();
recipes.forEach(r => {
  r.mood.forEach(m => m && moods.add(m));
  r.cuisine.forEach(c => c && cuisines.add(c));
  r.dietary.forEach(d => d && dietaries.add(d));
});

let activeFilters = { mood:[], cuisine:[], dietary:[] };
let searchTerm = '';

// ── RENDER FILTERS ─────────────────────────────────────────
function renderFilters() {
  const render = (set, containerId, category) => {
    const el = document.getElementById(containerId);
    Array.from(set).sort().forEach(val => {
      const btn = document.createElement('button');
      btn.className = 'filter-btn';
      btn.textContent = val;
      btn.dataset.val = val;
      btn.onclick = () => toggleFilter(category, val);
      el.appendChild(btn);
    });
  };
  render(moods,     'moodFilters',     'mood');
  render(cuisines,  'cuisineFilters',  'cuisine');
  render(dietaries, 'dietaryFilters',  'dietary');
}

function toggleFilter(cat, val) {
  const idx = activeFilters[cat].indexOf(val);
  if (idx > -1) activeFilters[cat].splice(idx, 1);
  else activeFilters[cat].push(val);
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.toggle('active',
      activeFilters.mood.includes(b.dataset.val) ||
      activeFilters.cuisine.includes(b.dataset.val) ||
      activeFilters.dietary.includes(b.dataset.val)
    );
  });
  render();
}

// ── FILTER LOGIC ───────────────────────────────────────────
function filtered() {
  return recipes.filter(r => {
    const mOk = !activeFilters.mood.length    || activeFilters.mood.some(m => r.mood.includes(m));
    const cOk = !activeFilters.cuisine.length || activeFilters.cuisine.some(c => r.cuisine.includes(c));
    const dOk = !activeFilters.dietary.length || activeFilters.dietary.some(d => r.dietary.includes(d));
    const sOk = !searchTerm || r.title.toLowerCase().includes(searchTerm) || r.ingredients.toLowerCase().includes(searchTerm);
    return mOk && cOk && dOk && sOk;
  });
}

// ── RENDER LIST ────────────────────────────────────────────
function render() {
  const list  = document.getElementById('recipeList');
  const empty = document.getElementById('emptyState');
  const rows  = filtered();

  document.getElementById('resultCount').textContent = rows.length;

  // Update header meta
  const today = new Date();
  const dateStr = today.toLocaleDateString('en-GB', { day:'numeric', month:'long', year:'numeric' });
  document.getElementById('headerMeta').innerHTML =
    `Paul Barbera — Sydney, Australia<br>${dateStr}<br>${rows.length} recipes`;

  if (!rows.length) { list.innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';

  list.innerHTML = rows.map((r, i) => {
    const moodTags    = r.mood.filter(Boolean).map(m => `<span class="tag mood">${m}</span>`).join('');
    const cuisineTags = r.cuisine.filter(Boolean).map(c => `<span class="tag cuisine">${c}</span>`).join('');
    const ingPrev     = r.ingredients.split(',').slice(0,4).join(', ').trim();
    const ingMore     = r.ingredients.split(',').length > 4 ? '…' : '';
    const cuisineLabel = r.cuisine.filter(Boolean).join(', ') || '';
    return `
    <div class="recipe-row" style="animation-delay:${i*0.025}s" onclick="openModal(${r.id})">
      <div class="recipe-num">${String(r.id).padStart(2,'0')}</div>
      <div class="recipe-main">
        <div class="recipe-title">${r.title}</div>
        <div class="recipe-tags">${moodTags}${cuisineTags}</div>
        <div class="recipe-ingredients">${ingPrev}${ingMore}</div>
      </div>
      <div class="recipe-side">
        ${cuisineLabel ? `<div class="recipe-cuisine-label">${cuisineLabel}</div>` : ''}
        <div class="recipe-time">${r.time}</div>
        <div class="recipe-servings">Serves ${r.servings}</div>
      </div>
    </div>`;
  }).join('');
}

// ── MODAL ──────────────────────────────────────────────────
function openModal(id) {
  const r = recipes.find(x => x.id === id);
  if (!r) return;
  const allTags = [
    ...r.mood.filter(Boolean).map(m => `<span class="tag mood">${m}</span>`),
    ...r.cuisine.filter(Boolean).map(c => `<span class="tag cuisine">${c}</span>`),
    ...r.dietary.filter(Boolean).map(d => `<span class="tag">${d}</span>`)
  ].join('');
  document.getElementById('modalBody').innerHTML = `
    ${r.cuisine.filter(Boolean).length ? `<div class="modal-cuisine">${r.cuisine.filter(Boolean).join(' · ')}</div>` : ''}
    <h2>${r.title}</h2>
    <div class="modal-meta">
      <span>${r.time}</span>
      <span>Serves ${r.servings}</span>
    </div>
    <div class="modal-tags">${allTags}</div>
    <div class="modal-section">
      <h3>Ingredients</h3>
      <ul class="ingredients-list">${r.ingredients.split(',').map(i => `<li>${i.trim()}</li>`).join('')}</ul>
    </div>
    <div class="modal-section">
      <h3>Method</h3>
      <ol class="instructions-list">${r.instructions.map(s => `<li>${s}</li>`).join('')}</ol>
    </div>
  `;
  document.getElementById('recipeModal').classList.add('active');
}

function closeModal() { document.getElementById('recipeModal').classList.remove('active'); }

document.getElementById('recipeModal').addEventListener('click', e => {
  if (e.target === document.getElementById('recipeModal')) closeModal();
});

// ── ADD RECIPE ─────────────────────────────────────────────
document.getElementById('addRecipeBtn').addEventListener('click', () => {
  document.getElementById('addRecipeModal').classList.add('active');
});

function closeForm() {
  document.getElementById('addRecipeModal').classList.remove('active');
  document.getElementById('recipeForm').reset();
}

document.getElementById('recipeForm').addEventListener('submit', e => {
  e.preventDefault();
  const nr = {
    id:       recipes.length + 1,
    title:    document.getElementById('formTitle').value,
    mood:     document.getElementById('formMood').value.split(',').map(s=>s.trim()).filter(Boolean),
    cuisine:  document.getElementById('formCuisine').value.split(',').map(s=>s.trim()).filter(Boolean),
    dietary:  document.getElementById('formDietary').value.split(',').map(s=>s.trim()).filter(Boolean),
    ingredients: document.getElementById('formIngredients').value,
    servings: document.getElementById('formServings').value,
    time:     document.getElementById('formTime').value,
    instructions: document.getElementById('formInstructions').value.split('\n').map(s=>s.trim()).filter(Boolean)
  };
  recipes.push(nr);
  nr.mood.forEach(m => moods.add(m));
  nr.cuisine.forEach(c => cuisines.add(c));
  nr.dietary.forEach(d => dietaries.add(d));
  // Rebuild filters
  document.getElementById('moodFilters').innerHTML = '';
  document.getElementById('cuisineFilters').innerHTML = '';
  document.getElementById('dietaryFilters').innerHTML = '';
  renderFilters();
  render();
  closeForm();
});

// ── SEARCH ─────────────────────────────────────────────────
document.getElementById('searchInput').addEventListener('input', e => {
  searchTerm = e.target.value.toLowerCase().trim();
  render();
});

// ── INIT ───────────────────────────────────────────────────
renderFilters();
render();
</script>
</body>
</html>
